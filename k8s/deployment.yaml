apiVersion: apps/v1
kind: Deployment
metadata:
  name: infoline-backend
  namespace: infoline-backend
  labels:
    app: infoline-backend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infoline-backend
  template:
    metadata:
      labels:
        app: infoline-backend
        version: v1
    spec:
      containers:
      - name: backend
        image: 744804011706.dkr.ecr.eu-west-3.amazonaws.com/infoline-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: JAVA_OPTS
          value: "-Xmx128m -Xms64m"
        - name: SERVER_PORT
          value: "8080"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
