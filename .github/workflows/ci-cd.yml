# ==============================================================================
# CI/CD Pipeline - InfoLine Backend (Spring Boot)
# ==============================================================================
# Pipeline GitHub Actions en 3 jobs séquentiels :
#   1. build-test       : compile, teste et package le JAR
#   2. docker-build-push: build image Docker + push ECR
#   3. deploy-to-eks    : déploiement sur EKS avec vérification
#
# Déclencheurs :
#   - push sur develop ou main    : pipeline complet
# ==============================================================================

name: Backend CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

# Variables d'environnement globales — partagées entre tous les jobs.
env:
  AWS_REGION: eu-west-3                   # Région AWS Paris
  ECR_REPOSITORY: infoline-backend        # Nom du dépôt ECR backend
  EKS_CLUSTER_NAME: infoline-eks-cluster  # Nom du cluster EKS (output Terraform)
  K8S_NAMESPACE: infoline-backend         # Namespace Kubernetes dédié au backend

jobs:

  # ============================================================================
  # Job 1 : Build and Test
  # ============================================================================
  # Compile le projet Maven, exécute les tests JUnit/MockMvc et package
  # le JAR exécutable.
  # ============================================================================
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'          # Java 21 LTS — cohérent avec le Dockerfile
          distribution: 'temurin'     # Eclipse Temurin
          cache: maven                # Cache du repository Maven
                                      # Réduit le temps de téléchargement des dépendances

      # Build sans tests d'abord — vérifie que le code compile avant de lancer les tests.
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      # Exécution des tests unitaires (HelloControllerTest.java).
      # ./mvnw (Maven Wrapper) : garantit la même version Maven en CI et en local
      # sans installation préalable sur GitHub Actions.
      - name: Run tests
        run: ./mvnw test

      # Upload du JAR comme artifact GitHub Actions.
      # Utile pour :
      #   - Télécharger le JAR depuis l'interface GitHub pour inspection
      #   - Réutiliser le JAR dans d'autres jobs sans rebuild (si nécessaire)
      # retention-days: 5 — conservé 5 jours (suffisant pour le debug)
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          retention-days: 5

  # ============================================================================
  # Job 2 : Build & Push Docker Image
  # ============================================================================
  # Exécuté uniquement sur develop et main après succès du job build-test.
  # Build l'image Docker multi-stage et la pousse sur ECR.
  # ============================================================================
  docker-build-push:
    name: Build & Push Docker Image
    needs: build-test   # Bloque tant que build-test n'est pas vert
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Authentification Docker auprès d'ECR via token temporaire AWS.
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Construction du tag image lisible : <branch>-<7 premiers caractères du SHA>
      # Exemples : develop-a1b2c3d, main-f4e5d6c
      # GITHUB_REF#refs/heads/ : supprime le préfixe "refs/heads/" de la variable
      # cut -c1-7 : tronque le SHA à 7 caractères (suffisant pour assurer l'unicité)
      - name: Extract metadata
        id: meta
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          VERSION="${BRANCH_NAME}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.version }}  # ex: develop-a1b2c3d (vu avant)
        run: |
          # Build avec le tag versionné (branch-sha)
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          # Tag supplémentaire "latest" — utilisé par k8s/deployment.yaml
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                     $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Push des deux tags vers ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "✅ Pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # ============================================================================
  # Job 3 : Deploy to EKS
  # ============================================================================
  # Déploie les manifests Kubernetes et attend la disponibilité effective
  # des pods avant de valider le déploiement.
  # ============================================================================
  deploy-to-eks:
    name: Deploy to EKS
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Génère kubeconfig pour kubectl via les credentials AWS configurés.
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Deploy to Kubernetes
        run: |
          # Apply de tous les manifests k8s/ (configmap, deployment, service)
          kubectl apply -f k8s/

          # Force le redémarrage des pods pour puller la nouvelle image "latest"
          # Note : pas de || true ici (contrairement au frontend) — le pod doit
          # exister à ce stade car le namespace et le deployment sont déjà créés
          # par kubectl apply ci-dessus.
          kubectl delete pod -n ${{ env.K8S_NAMESPACE }} -l app=infoline-backend

          # Pause pour laisser Kubernetes créer les nouveaux pods
          # avant de lancer le kubectl wait
          sleep 15

          # Attente active que les pods soient en état Ready.
          # Plus fiable qu'un sleep fixe — le job échoue si les pods
          # ne sont pas prêts dans les 180 secondes (timeout JVM cold start
          # + initialDelaySeconds: 60 de la readinessProbe = ~75s maxi).
          kubectl wait --for=condition=ready pod \
            -n ${{ env.K8S_NAMESPACE }} \
            -l app=infoline-backend \
            --timeout=180s

      # Affichage de l'état final des pods et services pour validation
      # visuelle dans les logs GitHub Actions.
      - name: Verify deployment
        run: |
          echo "✅ Deployment successful!"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}