# ==============================================================================
# application.properties - InfoLine Backend
# ==============================================================================
# Configuration Spring Boot de l'application.
# Les valeurs sensibles (DB_HOST, DB_USER, DB_PASSWORD) devraient être injectées
# depuis des variables d'environnement définies dans un Secret Kubernetes
# JAMAIS en clair dans ce fichier!
# ==============================================================================

# ------------------------------------------------------------------------------
# Serveur
# ------------------------------------------------------------------------------
# Port d'écoute du serveur Tomcat embarqué.
# Doit correspondre au containerPort dans k8s/deployment.yaml (8080)
# et au targetPort dans k8s/service.yaml.
server.port=8080

# Nom de l'application — affiché dans les logs au démarrage et
# utilisé comme identifiant dans Spring Boot Admin (si configuré).
spring.application.name=infoline-backend

# ------------------------------------------------------------------------------
# Spring Boot Actuator
# ------------------------------------------------------------------------------
# Actuator expose des endpoints de monitoring et de gestion de l'application.
# Seuls health et info sont exposés — évite d'exposer des endpoints sensibles
# sur un réseau accessible.
management.endpoints.web.exposure.include=health,info

# show-details=always : retourne le détail de chaque composant de santé
# dans la réponse /actuator/health.
# Utile pour le debugging
management.endpoint.health.show-details=always

# Permet à Actuator d'exposer les propriétés info.* via /actuator/info.
management.info.env.enabled=true

# ------------------------------------------------------------------------------
# Informations applicatives (/actuator/info)
# ------------------------------------------------------------------------------
# Métadonnées exposées via l'endpoint /actuator/info
# visibles dans les dashboards de monitoring et les health checks Kibana.
info.app.name=InfoLine Backend
info.app.description=API REST - Projet ECF DevOps
info.app.version=1.0.0

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
# Niveau INFO pour tous les packages — logs standards Spring Boot (démarrage,
# requêtes, erreurs) sans donner trop de détails.
logging.level.root=INFO

# Niveau DEBUG pour le code InfoLine uniquement — logs détaillés pour le
# développement et le troubleshooting sans noyer les logs des librairies.
logging.level.com.infoline=DEBUG

# ------------------------------------------------------------------------------
# PostgreSQL (non activé)
# ------------------------------------------------------------------------------
# Configuration de la datasource PostgreSQL — commentée car non requise
# pour la démonstration ECF (HelloController sans accès base de données).
#
# En production, on décommentera et on injectera les valeurs depuis des variables
# d'environnement du Secret Kubernetes :
#   DB_HOST : output Terraform rds_address (module RDS)
#   DB_NAME : output Terraform rds_database_name
#   DB_USER : var.db_username (sensible)
#   DB_PASSWORD : var.db_password (sensible)
#
# spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
# spring.datasource.username=${DB_USER}
# spring.datasource.password=${DB_PASSWORD}